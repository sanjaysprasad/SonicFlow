services:
  - type: web
    name: sonicflow
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 10000
      - key: MAX_CONCURRENT_JOBS
        value: 1
      - key: SONICFLOW_USE_COOKIES
        value: 0
